[project]
name = "lmlab"
version = "0.1.0"
description = "A learning laboratory for language models, GPU kernels, and inference engineering."
requires-python = ">=3.12"
dependencies = [
    "jupyterlab",
    "matplotlib",
    "numpy",
    "torch",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["resources/gpu-perf-engineering-resources"]
