[project]
name = "lmlab"
version = "0.1.0"
description = "A laboratory for implementing and understanding language models."
requires-python = ">=3.12"
dependencies = [
    "jupyterlab",
    "matplotlib",
    "numpy",
    "torch",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
